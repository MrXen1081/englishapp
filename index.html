<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>English File Pratik</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<header class="top">
  <h1>English<span>File</span></h1>
  <div class="top-r">
    <select id="unitSel" aria-label="Ünite"></select>
    <button id="setBtn" class="icon-btn" aria-label="Ayarlar">⚙</button>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="cards" class="on"><i>🗂</i>Kartlar</button>
  <button data-tab="quiz"><i>✏️</i>Quiz</button>
  <button data-tab="grammar"><i>📘</i>Gramer</button>
  <button data-tab="progress"><i>📊</i>İlerleme</button>
</nav>
<dialog id="settings" class="glass">
  <h3>Ayarlar</h3>
  <label class="row"><input type="checkbox" id="autoSpeak"> Kelimeyi otomatik oku</label>
  <label class="row">Konuşma hızı <input type="range" id="rate" min="0.5" max="1.2" step="0.1"></label>
  <p class="muted" id="voiceInfo"></p>
  <button class="btn" id="resetBtn">İlerlemeyi sıfırla</button>
  <button class="btn primary" id="closeSet">Kapat</button>
</dialog>
<script src="app.js"></script>
</body>
</html>
