<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<script>try{if(!sessionStorage.getItem("splash")){sessionStorage.setItem("splash","1");document.documentElement.classList.add("sp")}}catch(e){}</script>
<title>English File Pratik</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" role="dialog" aria-label="Created by MrXen"><div class="sp-glow"></div><div class="sp-in"><div class="sp-txt" id="spTxt" aria-hidden="true"></div><div class="sp-line"></div></div></div>
<div class="bg"></div><div class="veil"></div>
<header class="top">
  <h1>English<span>File</span></h1>
  <div class="top-r">
    <select id="unitSel" aria-label="Ünite"></select>
    <button id="setBtn" class="icon-btn" aria-label="Ayarlar">⚙</button>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="cards" class="on"><i>🗂</i>Kartlar</button>
  <button data-tab="quiz"><i>✏️</i>Quiz</button>
  <button data-tab="grammar"><i>📘</i>Gramer</button>
  <button data-tab="verbs"><i>🔁</i>Fiiller</button>
  <button data-tab="write"><i>📝</i>Yazma</button>
  <button data-tab="slot"><i>🎰</i>Kumar</button>
  <button data-tab="progress"><i>📊</i>İlerleme</button>
</nav>
<dialog id="settings" class="glass">
  <h3>Ayarlar</h3>
  <label class="row"><input type="checkbox" id="autoSpeak"> Kelimeyi otomatik oku</label>
  <label class="row">Konuşma hızı <input type="range" id="rate" min="0.5" max="1.2" step="0.1"></label>
  <p class="muted" id="voiceInfo"></p>
  <button class="btn" id="expBtn">İlerlemeyi indir</button>
  <button class="btn" id="impBtn">İlerlemeyi yükle</button>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
  <p class="muted" id="ioMsg" role="status"></p>
  <button class="btn" id="resetBtn">İlerlemeyi sıfırla</button>
  <button class="btn primary" id="closeSet">Kapat</button>
</dialog>
<script>
(function(){
  var sp=document.getElementById('splash');if(!sp)return;
  if(!document.documentElement.classList.contains('sp')){sp.remove();return}
  var t=document.getElementById('spTxt'),s='Created by MrXen';
  s.split('').forEach(function(c,i){var e=document.createElement('span');e.textContent=c===' '?'\u00a0':c;e.style.setProperty('--i',i);t.appendChild(e)});
  var gone=false;
  function bye(){if(gone)return;gone=true;sp.classList.add('out');setTimeout(function(){sp.remove()},600)}
  sp.addEventListener('click',bye);sp.addEventListener('touchstart',bye,{passive:true});
  addEventListener('keydown',bye,{once:true});
  setTimeout(bye,2800);
})();
</script>
<script src="app.js"></script>
<script src="slot.js"></script>
</body>
</html>
